name: Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check-test:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Node. Vitest 5 requires ^22.12.0 || ^24 || >=26, so
          # Node 20 can no longer run the test suite at all.
          - os: ubuntu-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 24
          # - os: windows-latest
          #   node-version: 24
          - os: macos-latest
            node-version: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # macOS node-gyp/electron rebuilds can fail with Python 3.12/distutils; pin 3.11.
      - name: Setup Python (for node-gyp on macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # Guards against worktree-relative link text that pnpm writes into this
      # checkout's node_modules when it is run inside a task worktree: those
      # links die with the worktree and break the next build.
      - name: node_modules symlinks
        run: pnpm run check:links

      - name: Root unit tests
        run: pnpm run test:fast

      # Integration tests spawn real CLI/server subprocesses and boot a fresh
      # process per scenario (~2s each), so they are slow and CPU-hungry by
      # design. They run here in CI rather than on pre-commit (`test:precommit`
      # is alias for `test:fast`) to keep local commits fast.
      - name: Integration tests (CI only)
        run: pnpm run test:integration

      - name: Web UI tests
        run: pnpm run web:test

      - name: packages/desktop typecheck
        run: pnpm --filter @kanban/desktop run typecheck

      - name: packages/desktop tests
        run: pnpm --filter @kanban/desktop test
